[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epidive-vp-ho-gpu"
version = "1.0.14"
description = "Installable GPU VP/high-order EpiDive workflow"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.12"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.25,<2.0",
  "pandas>=2.1,<3.0",
  "scipy>=1.11,<2.0",
  "numba>=0.59,<0.62",
  "joblib>=1.3",
  "threadpoolctl>=3.2",
  "tqdm>=4.66",
  "pyarrow>=14",
  "polars>=0.20",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
gpu-cu11 = ["cupy-cuda11x>=13,<14"]
gpu-cu12 = ["cupy-cuda12x>=13,<14"]

[project.scripts]
epidive-vp-ho-gpu = "EpiDive_vp_ho_gpu:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["epidive_data"]
py-modules = [
  "EpiDive_vp_ho_gpu",
  "epidis_cpu",
  "epidis_cpu_test",
  "epidis_cpu_fast",
  "epidis_reweight",
  "epidis_gwes",
  "epidis_gwes_high",
  "epidis_gwes_vp",
  "epidis_filter",
  "epidis_gpu",
]

[tool.setuptools.package-data]
epidive_data = ["*.txt", "*.csv"]
