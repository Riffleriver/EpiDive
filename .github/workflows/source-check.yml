name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-packaging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [cpu, gpu]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Compile Python sources
        run: python -m compileall -q ${{ matrix.component }}/src ${{ matrix.component }}/tests
      - name: Build wheel metadata
        run: python -m pip wheel --no-deps --no-build-isolation ./${{ matrix.component }} -w /tmp/wheels
