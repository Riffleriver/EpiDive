name: Bootstrap source

on:
  push:
    paths:
      - EpiDive-source-bootstrap.tar.gz
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unpack source
        run: |
          tar -xzf EpiDive-source-bootstrap.tar.gz
          rm EpiDive-source-bootstrap.tar.gz
          rm .github/workflows/bootstrap.yml
          rm .github/workflows/source-check.yml
      - name: Commit source tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish EpiDive source tree"
          git push
